
placeholder-identifier: 'bingo'

# The board is shared by all teams. Edit the material pool from /bingo admin.
teams:
  Red:
    display: '&cRed Team'
    color: RED
  Blue:
    display: '&9Blue Team'
    color: BLUE
assignments: {}

